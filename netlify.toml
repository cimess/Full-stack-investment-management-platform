[build]

  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://full-stack-investment-management-platform.onrender.com/api/:splat"
  status = 200
  force = true

# SPA routing: serve index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200